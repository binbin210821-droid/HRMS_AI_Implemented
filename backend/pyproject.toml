[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/realtime/websocket.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -m 'not integration'"
markers = [
    "integration: kiểm thử cần hạ tầng chạy thật, không chạy trong pytest mặc định",
]
